# An Argo Rollout replaces a Deployment and adds canary steps.
#
# On every change to the pod template:
#   1. Move ~20% of traffic to the new version and hold for 60s.
#   2. Move ~60% and hold for 30s.
#   3. Promote to 100%.
# From step 2 onwards, the "canary-health" analysis checks the canary's error
# rate and latency in Prometheus every 10s. Two failed checks abort the
# rollout: the canary is scaled down and all traffic stays on the stable version.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary-demo
  namespace: canary-demo
  labels:
    app.kubernetes.io/name: canary-demo
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: canary-demo
  strategy:
    canary:
      # Background analysis: runs alongside the steps, from step index 1 until promotion.
      analysis:
        startingStep: 1
        templates:
          - templateName: canary-health
        args:
          # Hash of the new ReplicaSet, so the queries only look at canary pods.
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 20
        - pause:
            duration: 60s
        - setWeight: 60
        - pause:
            duration: 30s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canary-demo
    spec:
      serviceAccountName: canary-demo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Built and loaded into kind by CI / scripts/demo.sh. A real pipeline
          # would push to a registry and set the image digest here.
          image: canary-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # A release is a change to this env block (or to the image). Edit it
          # in git, or use scripts/release.sh. ERROR_RATE / LATENCY_MS let you
          # simulate a bad release.
          env:
            - name: VERSION
              value: v1
            - name: ERROR_RATE
              value: "0"
            - name: LATENCY_MS
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2

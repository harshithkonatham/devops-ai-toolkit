apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: canary-demo
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - analysis-template.yaml
  - rollout.yaml
  - loadgen.yaml
  - networkpolicy.yaml
  - prometheus/prometheus.yaml
configMapGenerator:
  # A hash suffix is added to the name, so changing prometheus.yml restarts Prometheus.
  - name: prometheus-config
    files:
      - prometheus/prometheus.yml
